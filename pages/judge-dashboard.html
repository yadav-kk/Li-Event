<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Judge Panel - Literacy India</title>
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    
    <!-- Supabase & Auth -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/permissions.js"></script>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="app-sidebar">
            <div class="sidebar-logo">
                <div class="logo-icon">LI</div>
                <div class="logo-text">Literacy India</div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link"><span>Dashboard</span></a>
                <a href="events.html" class="nav-link" data-allowed-roles="super_admin, prog_admin, academic_lead, coordinator, management, project_director, ceo"><span>Events</span></a>
                <a href="students.html" class="nav-link" data-allowed-roles="super_admin, prog_admin, centre_incharge, coordinator, project_director, ceo"><span>Participants</span></a>
                <a href="centres.html" class="nav-link" data-allowed-roles="super_admin, prog_admin, coordinator, management, project_director, ceo"><span>Centres</span></a>
                <a href="users.html" class="nav-link" data-allowed-roles="super_admin, prog_admin"><span>Users</span></a>
                <a href="judge-dashboard.html" class="nav-link active" data-allowed-roles="judge, final_judge, super_admin, prog_admin, project_director, ceo"><span>Judge Panel</span></a>
                <a href="results.html" class="nav-link" data-allowed-roles="all"><span>Results & Rankings</span></a>
                <a href="evidence.html" class="nav-link" data-allowed-roles="super_admin, prog_admin, centre_incharge, project_director, ceo"><span>Evidence Upload</span></a>
                <a href="reports.html" class="nav-link" data-allowed-roles="super_admin, prog_admin, management, project_director, ceo"><span>Reports</span></a>
            </nav>
            
            <div class="sidebar-footer">
                <button class="logout-btn" id="logoutBtn">Logout</button>
            </div>
        </aside>

        <!-- Main Body -->
        <main class="app-main">
            <header class="app-header">
                <div class="header-title">
                    <h1>Judge Assessment Panel</h1>
                    <p class="user-centre-display">Local Centre</p>
                </div>
            </header>

            <section class="content-body">
                
                <div class="card" style="margin-bottom: 24px;">
                    <div class="card-header">
                        <h3 class="card-title">Assigned Assessments</h3>
                    </div>
                    <div class="table-container" style="border: none; margin-bottom: 0;">
                        <table class="data-table" id="judgeAssessTable">
                            <thead>
                                <tr>
                                    <th>Event & Stage</th>
                                    <th>Assessment Test</th>
                                    <th>Max Marks</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Fetching assigned assessments...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </section>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const isSessionValid = await window.Auth.checkSessionRedirect(['judge', 'final_judge', 'super_admin', 'prog_admin', 'project_director', 'ceo']);
            if (!isSessionValid) return;

            document.getElementById('logoutBtn').addEventListener('click', () => {
                window.Auth.signOut();
            });

            await fetchJudgeAssessments();
            window.Permissions.applyUIRules();
        });

        async function fetchJudgeAssessments() {
            if (!window.supabaseClient) return;

            try {
                const { data: assessments, error: asErr } = await window.supabaseClient
                    .from('event_assessments')
                    .select('*, stage_id!inner(name, status, event_id!inner(name))')
                    .eq('status', 'ACTIVE')
                    .order('sequence', { ascending: true });

                if (asErr) throw asErr;

                const hasAdminOverride = window.Auth.hasRole(['super_admin', 'prog_admin']);

                const tbody = document.querySelector('#judgeAssessTable tbody');
                tbody.innerHTML = '';

                if (assessments && assessments.length > 0) {
                    const now = new Date();
                    assessments.forEach(a => {
                        const start = a.start_datetime ? new Date(a.start_datetime) : null;
                        const end = a.end_datetime ? new Date(a.end_datetime) : null;

                        let badgeColor = 'completed'; // green
                        let statusText = 'Open';
                        let isBtnDisabled = false;
                        
                        if (start && now < start) {
                            badgeColor = 'draft'; // gray
                            statusText = `Upcoming (Opens ${start.toLocaleString()})${hasAdminOverride ? ' [Override]' : ''}`;
                            isBtnDisabled = !hasAdminOverride;
                        } else if (end && now > end) {
                            badgeColor = 'danger'; // red
                            statusText = `Closed (Ended ${end.toLocaleString()})${hasAdminOverride ? ' [Override]' : ''}`;
                            isBtnDisabled = !hasAdminOverride;
                        } else {
                            statusText = `Open (Closes ${end ? end.toLocaleString() : 'N/A'})`;
                        }

                        let actionHtml = '';
                        if (isBtnDisabled) {
                            actionHtml = `<button class="btn btn-secondary btn-sm" style="padding: 6px 12px; font-size: 0.8rem; opacity: 0.6; cursor: not-allowed;" disabled>Enter Scores</button>`;
                        } else {
                            actionHtml = `<a href="score-entry.html?assessment_id=${a.id}" class="btn btn-primary btn-sm" style="padding: 6px 12px; font-size: 0.8rem;">Enter Scores</a>`;
                        }

                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>
                                <strong>${a.stage_id.event_id.name}</strong><br>
                                <small style="color: var(--text-muted);">${a.stage_id.name}</small>
                            </td>
                            <td>${a.name}</td>
                            <td>${a.max_marks}</td>
                            <td><span class="badge badge-${badgeColor}">${statusText}</span></td>
                            <td>${actionHtml}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">No active assessments currently assigned to you.</td></tr>`;
                }

            } catch (err) {
                console.error("Error fetching judge assessments:", err);
            }
        }
    </script>
</body>
</html>
