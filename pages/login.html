<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Literacy India Event Portal</title>
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    
    <!-- Supabase & Auth JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase.js"></script>
    <script src="../assets/js/auth.js"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: var(--bg-base); padding: 20px;">

    <div class="card" style="width: 100%; max-width: 420px; padding: 32px; gap: 24px;">
        <div style="text-align: center; display: flex; flex-direction: column; gap: 8px;">
            <div style="display: inline-flex; align-self: center; width: 44px; height: 44px; background-color: var(--primary); border-radius: var(--radius-md); align-items: center; justify-content: center; font-weight: 700; font-size: 1.3rem;">LI</div>
            <h2 style="font-size: 1.35rem; font-weight: 600; letter-spacing: -0.02em; margin-top: 8px;">Welcome Back</h2>
            <p style="font-size: 0.85rem; color: var(--text-secondary);">Literacy India Assessment & Event Portal</p>
        </div>

        <form id="loginForm" style="display: flex; flex-direction: column; gap: 16px;">
            <div id="errorMessage" style="display: none; padding: 12px; border-radius: var(--radius-sm); background-color: var(--danger-light); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); font-size: 0.85rem; line-height: 1.4;"></div>
            
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input class="form-control" type="email" id="email" required placeholder="name@literacyindia.org" autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
            </div>

            <button class="btn btn-primary" type="submit" style="width: 100%; height: 44px; font-weight: 600; margin-top: 8px;">Sign In</button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            const errorMessage = document.getElementById('errorMessage');

            // If user is already logged in, redirect straight away
            const profile = window.Auth.getUserProfile();
            if (profile) {
                window.location.href = './dashboard.html';
            }

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                errorMessage.style.display = 'none';

                const email = document.getElementById('email').value.trim();
                const password = document.getElementById('password').value;

                try {
                    const submitBtn = loginForm.querySelector('button[type="submit"]');
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Signing in...';

                    await window.Auth.signIn(email, password);
                    window.location.href = './dashboard.html';
                } catch (err) {
                    console.error("Login error:", err);
                    errorMessage.textContent = err.message || "Invalid login credentials. Please try again.";
                    errorMessage.style.display = 'block';
                    
                    const submitBtn = loginForm.querySelector('button[type="submit"]');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In';
                }
            });
        });
    </script>
</body>
</html>
