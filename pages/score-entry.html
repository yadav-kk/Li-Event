<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Scores - Assessor Panel</title>
    <!-- Stylesheets -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    
    <!-- Supabase & Auth -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/permissions.js"></script>
    <script src="../assets/js/layout.js"></script>
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="app-sidebar">
            <div class="sidebar-logo">
                <div class="logo-icon">LI</div>
                <div class="logo-text">Literacy India</div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-link"><span>Dashboard</span></a>
                <a href="events.html" class="nav-link" data-allowed-roles="super_admin, prog_admin, academic_lead, coordinator, management, project_director, ceo"><span>Events</span></a>
                <a href="students.html" class="nav-link" data-allowed-roles="super_admin, prog_admin, centre_incharge, coordinator, project_director, ceo"><span>Participants</span></a>
                <a href="centres.html" class="nav-link" data-allowed-roles="super_admin, prog_admin, coordinator, management, project_director, ceo"><span>Centres</span></a>
                <a href="users.html" class="nav-link" data-allowed-roles="super_admin, prog_admin"><span>Users</span></a>
                <a href="judge-dashboard.html" class="nav-link active" data-allowed-roles="judge, final_judge, super_admin, prog_admin, project_director, ceo"><span>Judge Panel</span></a>
                <a href="results.html" class="nav-link" data-allowed-roles="all"><span>Results & Rankings</span></a>
                <a href="evidence.html" class="nav-link" data-allowed-roles="super_admin, prog_admin, centre_incharge, project_director, ceo"><span>Evidence Upload</span></a>
                <a href="reports.html" class="nav-link" data-allowed-roles="super_admin, prog_admin, management, project_director, ceo"><span>Reports</span></a>
            </nav>
            
            <div class="sidebar-footer">
                <button class="logout-btn" id="logoutBtn">Logout</button>
            </div>
        </aside>

        <!-- Main Body -->
        <main class="app-main">
            <header class="app-header">
                <div class="header-title">
                    <h1 id="assessmentHeader">Score Entry Matrix</h1>
                    <p id="assessmentSub">Stage: Centre Screening | Max Marks: 20</p>
                </div>
                <div class="header-actions">
                    <button class="btn btn-secondary" onclick="window.location.href='dashboard.html'">Back to Dashboard</button>
                </div>
            </header>

            <section class="content-body">
                
                <!-- Score Sheet Controls -->
                <div class="card" style="margin-bottom: 24px; flex-direction: row; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
                    <div>
                        <span style="color: var(--text-secondary); font-size: 0.85rem;">Active Assessor:</span>
                        <strong class="user-name-display" style="margin-left: 4px;">Assessor</strong>
                    </div>
                    
                    <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
                        <button class="btn btn-secondary" onclick="exportCSVTemplate()" style="background-color: var(--background); border: 1px solid var(--border);">Download Template</button>
                        <label class="btn btn-secondary" style="margin-bottom: 0; cursor: pointer; background-color: var(--background); border: 1px solid var(--border);">
                            Upload CSV
                            <input type="file" id="csvScoreFile" accept=".csv" onchange="importCSVScores(event)" style="display: none;">
                        </label>
                        <button class="btn btn-secondary" id="saveDraftBtn" onclick="saveAllScores('DRAFT')">Save Drafts</button>
                        <button class="btn btn-primary" id="submitBtn" onclick="saveAllScores('SUBMITTED')">Submit Score Sheet</button>
                    </div>
                </div>

                <div id="errorBanner" style="display: none; padding: 12px; border-radius: var(--radius-sm); background-color: var(--danger-light); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); font-size: 0.85rem; margin-bottom: 24px;"></div>
                <div id="successBanner" style="display: none; padding: 12px; border-radius: var(--radius-sm); background-color: var(--success-light); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.2); font-size: 0.85rem; margin-bottom: 24px;"></div>

                <!-- Search & Filters -->
                <div style="display: flex; gap: 16px; margin-bottom: 16px; align-items: center; flex-wrap: wrap;">
                    <div style="flex: 1; min-width: 200px;">
                        <input type="text" id="searchParticipant" class="form-control" placeholder="Search by participant name or ID..." oninput="debounceFilterMatrix()" style="padding: 8px 12px;">
                    </div>
                    <div style="width: 220px; min-width: 150px;">
                        <select id="centreFilterMatrix" class="form-control" onchange="filterMatrix()" style="padding: 8px 12px;">
                            <option value="">All Centres</option>
                        </select>
                    </div>
                </div>

                <!-- Main Matrix Card -->
                <div class="card">
                    <div class="table-container" style="border: none; margin-bottom: 0;">
                        <table class="data-table" id="scoreMatrixTable">
                            <thead>
                                <tr id="matrixHeader">
                                    <th>Participant ID</th>
                                    <th>Participant Name</th>
                                    <!-- Dynamic criteria columns header goes here -->
                                    <th>Total Score</th>
                                    <th>Remarks</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr><td colspan="4" style="text-align: center; color: var(--text-muted);">Loading participants matrix...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </section>
        </main>
    </div>

    <!-- Core Score Entry Matrix Handler -->
    <script>
        let assessmentId = '';
        let criteriaList = [];
        let participants = [];
        let scoreRecords = {}; // mapping: stage_participant_id -> { score_id, total, remarks, criteria: { crit_id: val } }
        let isSuperEventScope = false;

        document.addEventListener('DOMContentLoaded', async () => {
            const isSessionValid = await window.Auth.checkSessionRedirect(['judge', 'final_judge', 'super_admin', 'prog_admin', 'project_director', 'ceo']);
            if (!isSessionValid) return;

            document.getElementById('logoutBtn').addEventListener('click', () => {
                window.Auth.signOut();
            });

            // Extract assessment_id from URL query string
            const params = new URLSearchParams(window.location.search);
            assessmentId = params.get('assessment_id');

            if (!assessmentId) {
                alert("No assessment specified.");
                window.location.href = 'dashboard.html';
                return;
            }

            await loadMatrixStructure();
            window.Permissions.applyUIRules();
        });

        async function loadMatrixStructure() {
            if (!window.supabaseClient) return;

            try {
                // 1. Fetch assessment configuration details
                const { data: assess, error: assErr } = await window.supabaseClient
                    .from('event_assessments')
                    .select('*, stage_id!inner(id, name, start_datetime, end_datetime, event_id!inner(id, name))')
                    .eq('id', assessmentId)
                    .single();

                if (assErr) throw assErr;

                // Check permissions and direct centre marking features
                const profile = window.Auth.getUserProfile();
                const isSuperRole = window.Auth.hasRole(['super_admin', 'prog_admin']);
                const isPDOrCoord = window.Auth.hasRole(['project_director', 'coordinator', 'ceo', 'management']);
                const isJudge = window.Auth.hasRole(['judge', 'final_judge']);

                // Query if user is an event lead
                let isEventLead = false;
                if (profile) {
                    const { data: leadData } = await window.supabaseClient
                        .from('event_leads')
                        .select('id')
                        .eq('user_id', profile.id)
                        .eq('event_id', assess.stage_id.event_id.id);
                    isEventLead = leadData && leadData.length > 0;
                }

                // Super Event Scope = Admins, CEO, Main Judge, or designated Event Leads
                isSuperEventScope = isSuperRole || isEventLead;

                let allowedCentreIds = [];
                let isAssigned = false;
                if (isPDOrCoord) {
                    const { data: ucData } = await window.supabaseClient
                        .from('user_centres')
                        .select('centre_id')
                        .eq('user_id', profile.id);
                    allowedCentreIds = ucData ? ucData.map(uc => uc.centre_id) : [];
                } else if (isJudge && profile) {
                    const { data: assignData } = await window.supabaseClient
                        .from('assessment_assignments')
                        .select('centre_id')
                        .eq('judge_id', profile.id)
                        .eq('assessment_id', assessmentId);
                    allowedCentreIds = assignData ? assignData.map(a => a.centre_id).filter(id => id) : [];
                    isAssigned = assignData && assignData.length > 0;
                }

                // Check if allow_centre_marking feature is enabled for this event
                let allowCentreMarking = false;
                try {
                    const { data: fMapping } = await window.supabaseClient
                        .from('event_features_mapping')
                        .select('is_enabled')
                        .eq('event_id', assess.stage_id.event_id.id)
                        .eq('feature_code', 'allow_centre_marking')
                        .maybeSingle();
                    allowCentreMarking = fMapping ? fMapping.is_enabled : false;
                } catch (err) {
                    console.log("event_features_mapping table not found or query failed.");
                }

                // Check if user's centre is mapped to the event
                let isCentreMappedToEvent = false;
                if (profile && profile.centre_id) {
                    const { data: ecData } = await window.supabaseClient
                        .from('event_centres')
                        .select('centre_id')
                        .eq('event_id', assess.stage_id.event_id.id)
                        .eq('centre_id', profile.centre_id);
                    isCentreMappedToEvent = ecData && ecData.length > 0;
                }

                const hasDirectCentreAccess = allowCentreMarking && isCentreMappedToEvent;
                const hasAccess = isSuperEventScope || isPDOrCoord || isAssigned || hasDirectCentreAccess || isJudge;

                if (!hasAccess) {
                    alert("Access Denied: You do not have permissions to grade this assessment.");
                    window.location.href = "judge-dashboard.html";
                    return;
                }

                document.getElementById('assessmentHeader').textContent = `Score Entry: ${assess.name}`;
                document.getElementById('assessmentSub').textContent = `Event: ${assess.stage_id.event_id.name} | Stage: ${assess.stage_id.name} | Max Marks: ${assess.max_marks}`;

                // Check if current date is within stage date range
                const now = new Date();
                const start = assess.stage_id.start_datetime ? new Date(assess.stage_id.start_datetime) : null;
                const end = assess.stage_id.end_datetime ? new Date(assess.stage_id.end_datetime) : null;
                
                let isOutsideDateWindow = false;
                let dateWarningText = '';
                
                if (start && now < start) {
                    isOutsideDateWindow = true;
                    dateWarningText = `This stage is Scheduled to open on ${start.toLocaleString()}.`;
                } else if (end && now > end) {
                    isOutsideDateWindow = true;
                    dateWarningText = `This stage ended on ${end.toLocaleString()}.`;
                }

                if (isOutsideDateWindow) {
                    const isAdmin = isSuperEventScope;

                    if (isAdmin) {
                        // Display admin override warning banner
                        const alertDiv = document.createElement('div');
                        alertDiv.className = 'alert alert-warning';
                        alertDiv.style.marginBottom = '20px';
                        alertDiv.style.background = '#fef3c7';
                        alertDiv.style.border = '1px solid #f59e0b';
                        alertDiv.style.color = '#b45309';
                        alertDiv.style.padding = '12px 16px';
                        alertDiv.style.borderRadius = '8px';
                        alertDiv.innerHTML = `⚠️ <strong>Admin Override Mode</strong>: ${dateWarningText} You have access to edit scores.`;
                        document.querySelector('.content-body').insertBefore(alertDiv, document.querySelector('.content-body').firstChild);
                    } else {
                        // Display locked banner
                        const alertDiv = document.createElement('div');
                        alertDiv.className = 'alert alert-danger';
                        alertDiv.style.marginBottom = '20px';
                        alertDiv.style.background = '#fee2e2';
                        alertDiv.style.border = '1px solid #ef4444';
                        alertDiv.style.color = '#b91c1c';
                        alertDiv.style.padding = '12px 16px';
                        alertDiv.style.borderRadius = '8px';
                        alertDiv.innerHTML = `⚠️ <strong>Grading Closed</strong>: ${dateWarningText} The score sheet is in read-only mode.`;
                        document.querySelector('.content-body').insertBefore(alertDiv, document.querySelector('.content-body').firstChild);
                        
                        // Disable all input fields and actions
                        setTimeout(() => {
                            document.querySelectorAll('.matrix-input, .remarks-input, button').forEach(el => {
                                if (!el.classList.contains('logout-btn') && el.id !== 'logoutBtn') {
                                    el.disabled = true;
                                    el.style.cursor = 'not-allowed';
                                }
                            });
                        }, 500);
                    }
                }

                // 2. Fetch assessment criteria params
                const { data: criteria, error: critErr } = await window.supabaseClient
                    .from('assessment_criteria')
                    .select('*')
                    .eq('assessment_id', assessmentId)
                    .order('sequence', { ascending: true });

                if (critErr) throw critErr;
                criteriaList = criteria;

                // Render dynamic criteria columns in table headers
                const headerRow = document.getElementById('matrixHeader');
                const totalCol = headerRow.lastElementChild.previousElementSibling;
                
                criteriaList.forEach(crit => {
                    const th = document.createElement('th');
                    th.innerHTML = `${crit.name}<br><small style="color: var(--text-secondary); font-size: 0.75rem;">Max: ${crit.max_marks}</small>`;
                    // Insert before Total column
                    headerRow.insertBefore(th, totalCol);
                });

                // 3. Fetch Stage Participants
                // Filter participants dynamically by the judge's assigned centre(s) or direct centre access
                let query = window.supabaseClient
                    .from('stage_participants')
                    .select('*, participant_id!inner(id, registration_number, student_id!inner(id, student_id, name, centre_id, centres!inner(id, centre_name)))')
                    .eq('stage_id', assess.stage_id.id);

                if (!isSuperEventScope) {
                    if (isPDOrCoord || isJudge) {
                        if (allowedCentreIds.length > 0) {
                            query = query.in('participant_id.student_id.centre_id', allowedCentreIds);
                        }
                        // If no centres are allotted / user is HQ All, do not filter by centre (allowing them to see all participants)
                    } else if (hasDirectCentreAccess && profile.centre_id) {
                        query = query.eq('participant_id.student_id.centre_id', profile.centre_id);
                    }
                }

                const { data: spList, error: spErr } = await query;
                if (spErr) throw spErr;
                participants = spList;

                // Populate centre select dropdown dynamically from loaded participants
                const centreMap = new Map();
                participants.forEach(sp => {
                    const student = sp.participant_id?.student_id;
                    if (student && student.centres) {
                        const cId = student.centres.id;
                        const cName = student.centres.centre_name;
                        if (!centreMap.has(cId)) {
                            centreMap.set(cId, { name: cName, count: 0 });
                        }
                        centreMap.get(cId).count++;
                    }
                });

                const centreSelect = document.getElementById('centreFilterMatrix');
                centreSelect.innerHTML = '<option value="">All Centres</option>';
                
                // Sort centres alphabetically
                const sortedCentres = Array.from(centreMap.entries()).sort((a, b) => a[1].name.localeCompare(b[1].name));
                
                sortedCentres.forEach(([cId, info]) => {
                    const opt = document.createElement('option');
                    opt.value = cId;
                    opt.textContent = `${info.name} (${info.count})`;
                    centreSelect.appendChild(opt);
                });

                // 4. Fetch existing scores entered for this assessment by this judge
                const { data: existingScores, error: scErr } = await window.supabaseClient
                    .from('assessment_scores')
                    .select('*, criteria_scores(*)')
                    .eq('assessment_id', assessmentId)
                    .eq('judge_id', profile.id);

                if (scErr) throw scErr;

                // Map existing scores
                existingScores.forEach(es => {
                    const critScores = {};
                    es.criteria_scores.forEach(cs => {
                        critScores[cs.criteria_id] = cs.score;
                    });
                    
                    scoreRecords[es.stage_participant_id] = {
                        score_id: es.id,
                        total_score: es.total_score,
                        remarks: es.remarks || '',
                        status: es.status,
                        criteria: critScores
                    };
                });

                renderScoreMatrix();

            } catch (err) {
                console.error("Error loading matrix:", err);
                document.getElementById('errorBanner').textContent = err.message || "Failed to load score sheets.";
                document.getElementById('errorBanner').style.display = 'block';
            }
        }

        function renderScoreMatrix(listToRender) {
            const tbody = document.querySelector('#scoreMatrixTable tbody');
            tbody.innerHTML = '';

            const list = listToRender || participants;

            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${4 + criteriaList.length}" style="text-align: center; color: var(--text-muted);">No matching participants found.</td></tr>`;
                return;
            }

            const fragment = document.createDocumentFragment();

            list.forEach(sp => {
                const sInfo = sp.participant_id.student_id;
                const rec = scoreRecords[sp.id] || { total_score: 0, remarks: '', status: 'DRAFT', criteria: {} };
                
                const tr = document.createElement('tr');
                tr.setAttribute('data-sp-id', sp.id);
                
                let html = `
                    <td>${sInfo.student_id}</td>
                    <td><strong>${sInfo.name}</strong></td>
                `;

                // Dynamic inputs for each criteria
                criteriaList.forEach(crit => {
                    const scoreVal = rec.criteria[crit.id] !== undefined ? rec.criteria[crit.id] : '';
                    const isLocked = (rec.status === 'LOCKED' || rec.status === 'SUBMITTED') && !isSuperEventScope;
                    
                    html += `
                        <td>
                            <input class="form-control crit-input" 
                                   type="number" 
                                   step="0.5" 
                                   min="0" 
                                   max="${crit.max_marks}" 
                                   data-crit-id="${crit.id}" 
                                   data-max="${crit.max_marks}"
                                   value="${scoreVal}"
                                   ${isLocked ? 'disabled' : ''}
                                   oninput="updateStudentTotalScore(this.parentElement.parentElement)"
                                   style="width: 80px; text-align: right; padding: 6px 10px;">
                        </td>
                    `;
                });

                const isLocked = (rec.status === 'LOCKED' || rec.status === 'SUBMITTED') && !isSuperEventScope;
                
                html += `
                    <td>
                        <input class="form-control total-display" 
                               type="text" 
                               value="${rec.total_score}" 
                               disabled 
                               style="width: 80px; font-weight: bold; text-align: right; background-color: rgba(255,255,255,0.05);">
                    </td>
                    <td>
                        <input class="form-control remarks-input" 
                               type="text" 
                               value="${rec.remarks}" 
                               placeholder="Add feedback"
                               ${isLocked ? 'disabled' : ''}
                               oninput="updateStudentRemarks(this.parentElement.parentElement)"
                               style="min-width: 140px;">
                    </td>
                `;

                tr.innerHTML = html;
                fragment.appendChild(tr);
            });
            
            tbody.appendChild(fragment);
        }

        function updateStudentTotalScore(rowEl) {
            const spId = rowEl.getAttribute('data-sp-id');
            let total = 0;
            const inputs = rowEl.querySelectorAll('.crit-input');
            
            if (!scoreRecords[spId]) {
                scoreRecords[spId] = { total_score: 0, remarks: '', status: 'DRAFT', criteria: {} };
            }
            
            inputs.forEach(inp => {
                const critId = inp.getAttribute('data-crit-id');
                const valStr = inp.value.trim();
                if (valStr !== '') {
                    const val = parseFloat(valStr) || 0;
                    scoreRecords[spId].criteria[critId] = val;
                    total += val;
                } else {
                    delete scoreRecords[spId].criteria[critId];
                }
            });
            
            scoreRecords[spId].total_score = total;
            rowEl.querySelector('.total-display').value = total.toFixed(2);
        }

        function updateStudentRemarks(rowEl) {
            const spId = rowEl.getAttribute('data-sp-id');
            const remarksVal = rowEl.querySelector('.remarks-input').value.trim();
            if (!scoreRecords[spId]) {
                scoreRecords[spId] = { total_score: 0, remarks: '', status: 'DRAFT', criteria: {} };
            }
            scoreRecords[spId].remarks = remarksVal;
        }

        async function saveAllScores(statusString) {
            if (!window.supabaseClient) return;

            const errorDiv = document.getElementById('errorBanner');
            const successDiv = document.getElementById('successBanner');
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            const profile = window.Auth.getUserProfile();

            if (statusString === 'SUBMITTED') {
                const conf = confirm("Are you sure you want to Submit this score sheet? This will lock edit access for you.");
                if (!conf) return;
            }

            try {
                const scoresToUpsert = [];
                const localCritDataMap = {}; // Maps stage_participant_id -> criteria data

                // Loop through all loaded participants (even if currently filtered out in the UI)
                for (const sp of participants) {
                    const spId = sp.id;
                    const rec = scoreRecords[spId];
                    if (!rec) continue; // Skip if no scores entered at all

                    const totalScore = rec.total_score || 0;
                    const remarks = rec.remarks ? rec.remarks.trim() : '';

                    // 1. Check if score matrix is complete/valid
                    let skipRow = false;
                    const critData = [];
                    
                    for (const crit of criteriaList) {
                        const val = rec.criteria[crit.id];

                        if (val === undefined || val === null || val === '') {
                            // If submitted, require all fields
                            if (statusString === 'SUBMITTED') {
                                throw new Error(`All criteria fields must be filled before submitting. Missing marks for student ${sp.participant_id.student_id.name}.`);
                            } else {
                                skipRow = true;
                                break;
                            }
                        }

                        const numericVal = parseFloat(val);
                        const maxVal = parseFloat(crit.max_marks);
                        if (numericVal < 0 || numericVal > maxVal) {
                            throw new Error(`Score limit error: criteria score ${numericVal} exceeds max ${maxVal} for student ${sp.participant_id.student_id.name}.`);
                        }
                        
                        critData.push({ criteria_id: crit.id, score: numericVal });
                    }

                    if (skipRow) continue; // Skip saving empty drafts for specific rows

                    const scorePayload = {
                        assessment_id: assessmentId,
                        stage_participant_id: spId,
                        judge_id: profile.id,
                        total_score: totalScore,
                        remarks: remarks,
                        status: statusString,
                        updated_at: new Date().toISOString()
                    };

                    if (rec.score_id) {
                        scorePayload.id = rec.score_id;
                    }

                    scoresToUpsert.push(scorePayload);
                    localCritDataMap[spId] = critData;
                }

                if (scoresToUpsert.length > 0) {
                    // Batch Upsert 1: assessment_scores
                    const { data: upsertedScores, error: scoreErr } = await window.supabaseClient
                        .from('assessment_scores')
                        .upsert(scoresToUpsert, {
                            onConflict: 'assessment_id,stage_participant_id,judge_id'
                        })
                        .select('id, stage_participant_id');

                    if (scoreErr) throw scoreErr;

                    // Build batch criteria_scores payload
                    const criteriaScoresToUpsert = [];
                    for (const scoreRow of upsertedScores) {
                        const spId = scoreRow.stage_participant_id;
                        const scoreId = scoreRow.id;
                        const critData = localCritDataMap[spId];

                        // Cache it back locally
                        if (scoreRecords[spId]) {
                            scoreRecords[spId].score_id = scoreId;
                        }

                        if (critData) {
                            critData.forEach(cd => {
                                criteriaScoresToUpsert.push({
                                    score_id: scoreId,
                                    criteria_id: cd.criteria_id,
                                    score: cd.score
                                });
                            });
                        }
                    }

                    // Batch Upsert 2: criteria_scores
                    if (criteriaScoresToUpsert.length > 0) {
                        const { error: critErr } = await window.supabaseClient
                            .from('criteria_scores')
                            .upsert(criteriaScoresToUpsert, {
                                onConflict: 'score_id,criteria_id'
                            });
                        if (critErr) throw critErr;
                    }
                }

                successDiv.textContent = `Score sheets successfully saved as ${statusString}!`;
                successDiv.style.display = 'block';

                // Reload layout details
                await loadMatrixStructure();

            } catch (err) {
                console.error("Score matrix save error:", err);
                errorDiv.textContent = err.message || "Failed to update participant score sheet.";
                errorDiv.style.display = 'block';
            }
        }

        // CSV Import/Export & Filter Operations
        function exportCSVTemplate() {
            if (criteriaList.length === 0 || participants.length === 0) {
                alert("Scoring matrix is empty or not loaded yet.");
                return;
            }

            const searchVal = document.getElementById('searchParticipant').value.toLowerCase().trim();
            const centreVal = document.getElementById('centreFilterMatrix').value;

            let listToExport = [...participants];

            if (searchVal) {
                listToExport = listToExport.filter(sp => {
                    const sInfo = sp.participant_id.student_id;
                    const name = sInfo.name.toLowerCase();
                    const id = sInfo.student_id.toLowerCase();
                    return name.includes(searchVal) || id.includes(searchVal);
                });
            }

            if (centreVal) {
                listToExport = listToExport.filter(sp => {
                    const sInfo = sp.participant_id.student_id;
                    return sInfo.centre_id === centreVal;
                });
            }

            // Build dynamic headers
            const headers = ['Participant ID', 'Participant Name'];
            criteriaList.forEach(crit => {
                headers.push(`${crit.name} (Max: ${crit.max_marks})`);
            });
            headers.push('Remarks');

            let csvContent = headers.map(h => `"${h.replace(/"/g, '""')}"`).join(',') + '\n';

            // Build rows
            listToExport.forEach(sp => {
                const sInfo = sp.participant_id.student_id;
                const rec = scoreRecords[sp.id] || { total_score: 0, remarks: '', criteria: {} };

                const row = [sInfo.student_id, sInfo.name];
                criteriaList.forEach(crit => {
                    const score = rec.criteria[crit.id] !== undefined ? rec.criteria[crit.id] : '';
                    row.push(score);
                });
                row.push(rec.remarks || '');

                csvContent += row.map(val => `"${String(val).replace(/"/g, '""')}"`).join(',') + '\n';
            });

            // Trigger download
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `ScoreSheet_Template_${assessmentId}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function importCSVScores(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const text = e.target.result;
                    const lines = parseCSVText(text);
                    if (lines.length < 2) {
                        alert("Invalid CSV file structure.");
                        return;
                    }

                    const headers = lines[0].map(h => h.trim().toLowerCase());
                    const idIdx = headers.indexOf('participant id');
                    const remarksIdx = headers.indexOf('remarks');

                    if (idIdx === -1) {
                        alert("CSV is missing the required 'Participant ID' column.");
                        return;
                    }

                    // Map criteria headers to criteria IDs
                    const critHeaderMap = {};
                    criteriaList.forEach(crit => {
                        const critIdx = headers.findIndex(h => h.includes(crit.name.toLowerCase()));
                        if (critIdx !== -1) {
                            critHeaderMap[crit.id] = critIdx;
                        }
                    });

                    let importCount = 0;

                    for (let i = 1; i < lines.length; i++) {
                        const row = lines[i];
                        if (row.length === 0 || (row.length === 1 && row[0] === '')) continue;

                        const participantId = row[idIdx]?.trim();
                        if (!participantId) continue;

                        const sp = participants.find(item => item.participant_id.student_id.student_id === participantId);
                        if (!sp) continue;

                        const spId = sp.id;
                        if (!scoreRecords[spId]) {
                            scoreRecords[spId] = { total_score: 0, remarks: '', status: 'DRAFT', criteria: {} };
                        }

                        let total = 0;
                        criteriaList.forEach(crit => {
                            const headerIdx = critHeaderMap[crit.id];
                            if (headerIdx !== undefined && row[headerIdx] !== undefined) {
                                const scoreValStr = row[headerIdx].trim();
                                if (scoreValStr !== '') {
                                    const scoreVal = parseFloat(scoreValStr);
                                    if (!isNaN(scoreVal)) {
                                        scoreRecords[spId].criteria[crit.id] = scoreVal;
                                        total += scoreVal;
                                    }
                                }
                            }
                        });

                        scoreRecords[spId].total_score = total;

                        if (remarksIdx !== -1 && row[remarksIdx] !== undefined) {
                            scoreRecords[spId].remarks = row[remarksIdx].trim();
                        }

                        importCount++;
                    }

                    alert(`Imported scores for ${importCount} participants successfully! Please review the values in the table below and click "Save Drafts" or "Submit" to save.`);
                    
                    // Re-render scoring matrix
                    filterMatrix();

                } catch (err) {
                    console.error("CSV import parsing error:", err);
                    alert("Failed to parse CSV: " + err.message);
                } finally {
                    document.getElementById('csvScoreFile').value = '';
                }
            };
            reader.readAsText(file);
        }

        function parseCSVText(text) {
            const result = [];
            let row = [];
            let inQuotes = false;
            let currentField = '';

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                const nextChar = text[i+1];

                if (inQuotes) {
                    if (char === '"') {
                        if (nextChar === '"') {
                            currentField += '"';
                            i++;
                        } else {
                            inQuotes = false;
                        }
                    } else {
                        currentField += char;
                    }
                } else {
                    if (char === '"') {
                        inQuotes = true;
                    } else if (char === ',') {
                        row.push(currentField);
                        currentField = '';
                    } else if (char === '\n' || char === '\r') {
                        row.push(currentField);
                        currentField = '';
                        if (row.length > 0 && !(row.length === 1 && row[0] === '')) {
                            result.push(row);
                        }
                        row = [];
                        if (char === '\r' && nextChar === '\n') {
                            i++;
                        }
                    } else {
                        currentField += char;
                    }
                }
            }
            if (currentField || row.length > 0) {
                row.push(currentField);
                result.push(row);
            }
            return result;
        }

        let filterMatrixTimeout;
        function debounceFilterMatrix() {
            clearTimeout(filterMatrixTimeout);
            filterMatrixTimeout = setTimeout(() => {
                filterMatrix();
            }, 300);
        }

        function filterMatrix() {
            const searchVal = document.getElementById('searchParticipant').value.toLowerCase().trim();
            const centreVal = document.getElementById('centreFilterMatrix').value;

            let filtered = [...participants];

            if (searchVal) {
                filtered = filtered.filter(sp => {
                    const sInfo = sp.participant_id.student_id;
                    const name = sInfo.name.toLowerCase();
                    const id = sInfo.student_id.toLowerCase();
                    return name.includes(searchVal) || id.includes(searchVal);
                });
            }

            if (centreVal) {
                filtered = filtered.filter(sp => {
                    const sInfo = sp.participant_id.student_id;
                    return sInfo.centre_id === centreVal;
                });
            }

            renderScoreMatrix(filtered);
        }
    </script>
